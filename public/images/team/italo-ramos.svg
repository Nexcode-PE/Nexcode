<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101d"/>
      <stop offset="50%" stop-color="#0d1f35"/>
      <stop offset="100%" stop-color="#0a1728"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A8FF"/>
      <stop offset="50%" stop-color="#00D2D0"/>
      <stop offset="100%" stop-color="#20E3A2"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112946"/>
      <stop offset="100%" stop-color="#0e2238"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00d2d0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00d2d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  <circle cx="200" cy="130" r="140" fill="url(#glow)"/>

  <!-- Subtle background tech grid lines -->
  <path d="M 50 150 L 350 150 M 200 40 L 200 260" stroke="#00a8ff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 6"/>
  <circle cx="200" cy="130" r="105" fill="none" stroke="#20e3a2" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- Avatar Outer Ring -->
  <circle cx="200" cy="130" r="76" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Avatar Inner Circle -->
  <circle cx="200" cy="130" r="70" fill="url(#circleGrad)"/>

  <!-- Initials "IR" -->
  <text x="200" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#primaryGrad)" letter-spacing="2">IR</text>

  <!-- Badge at bottom -->
  <g transform="translate(145, 230)">
    <rect width="110" height="24" rx="12" fill="#0c1b2c" stroke="#00d2d0" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="16" cy="12" r="3.5" fill="#20e3a2"/>
    <text x="60" y="15.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#93a8c1" letter-spacing="0.5">NEXCODE</text>
  </g>
</svg>
